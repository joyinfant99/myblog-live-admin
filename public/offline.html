<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Offline | Admin</title>
<style>
:root{color-scheme:light dark;--bg:#fcfbf8;--fg:#292825;--muted:#7d7b74;--accent:#8a5c22}
@media(prefers-color-scheme:dark){:root{--bg:#191918;--fg:#ecebe6;--muted:#969490;--accent:#d4a65a}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,sans-serif;padding:24px;text-align:center}
h1{font-size:22px;margin:0 0 6px;letter-spacing:-.01em}p{margin:0 0 22px;color:var(--muted)}
.mark{font:italic 54px Georgia,serif;color:var(--accent);margin-bottom:10px}
button{font:inherit;font-weight:500;border:1px solid var(--fg);background:var(--fg);color:var(--bg);border-radius:6px;padding:10px 18px;cursor:pointer}
</style></head><body><main>
<div class="mark">J</div><h1>You’re offline</h1><p>The admin needs a connection to load your posts and notes.</p>
<button onclick="location.reload()">Try again</button>
</main></body></html>
